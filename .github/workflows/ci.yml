name: CI

on: push

jobs:

  bundle-app:
    name: Bundle App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - run: mkdir -p dist
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - run: |
          make package
      - uses: actions/upload-artifact@v2
        with:
          name: app_tgz
          path: build/jellyfisher.tgz

      - uses: actions/upload-artifact@v2
        with:
          name: app_dir
          path: jellyfisher

  slim-validate:
    name: SLIM Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Slim Validate
        run: slim validate jellyfisher

  appinspect-cli:
    needs: bundle-app
    name: AppInspect CLI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v2
        with:
          name: app_tgz
          path: jellyfisher.tgz

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.7"

      - name: Install dependencies
        run: |
          sudo apt-get install libxml2-dev libxslt1-dev
          python -m pip install http://download.splunk.com/misc/appinspect/splunk-appinspect-latest.tar.gz
      - name: Run AppInspect
        run: |
          splunk-appinspect inspect jellyfisher.tgz --output-file appinspect.json
          exit `cat appinspect.json | jq '.summary.failure'`

  splunk-test:
    runs-on: ubuntu-latest
    services:
      splunk:
        image: splunk/splunk
        env:
          SPLUNK_START_ARGS: --accept-license
          SPLUNK_PASSWORD: password
        options: >-
          --health-interval 30s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8000:8000
          - 8089:8089
        volumes:
          - jellyfisher:/opt/splunk/etc/apps/jellyfisher

    steps:
      - uses: actions/download-artifact@v2
        with:
          name: app_dir
          path: jellyfisher

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          curl -k -u admin:password https://localhost:8089/services/apps/local
      - name: Restart instance
        run: |
          curl -k -u admin:password https://localhost:8089/services/server/control/restart -X POST
      - name: Test Jellyfisher command
        run: |
          curl -k -u admin:password https://localhost:8089/services/search/jobs/export -d search="makeresults n=3 | eval x="asd" | eval y="asf" | jellyfisher levenshtein_distance(x,y)" -d output_mode=csv



  appinspect-api:
      name: AppInspect API Validation
      needs: 
        - appinspect-cli
        - slim-validate
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/master'
      steps:
      - uses: actions/download-artifact@v2
        with:
          name: app_tgz
      - run: ls -a
      - uses: splunk/appinspect-api-action@v2
        with:
          filePath: jellyfisher.tgz
          splunkUser: ${{ secrets.SPLUNK_USER }}
          splunkPassword: ${{ secrets.SPLUNK_PASS }}
          includedTags: cloud
          failOnError: true
          failOnWarning: false
