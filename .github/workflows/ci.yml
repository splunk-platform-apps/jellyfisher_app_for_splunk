name: CI

on: push

jobs:

  bundle-app:
    name: Bundle App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - run: |
          make package
      - uses: actions/upload-artifact@v6
        with:
          name: app_tgz
          path: build/jellyfisher.tgz

      - uses: actions/upload-artifact@v6
        with:
          name: app_dir
          path: jellyfisher

  slim-validate:
    name: SLIM Validation
    runs-on: ubuntu-latest
    needs: bundle-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          path: src_checkout
      - uses: actions/download-artifact@v5
        with:
          name: app_dir
          path: jellyfisher
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        working-directory: ./src_checkout
      - name: Slim Validate
        run: slim validate jellyfisher

  appinspect-cli:
    needs: bundle-app
    name: AppInspect CLI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: app_tgz
          path: jellyfisher

      - uses: splunk/appinspect-cli-action@v2.12
        with:
          app_path: jellyfisher
          included_tags: cloud

      - name: Check AppInspect Results
        run: |
          exit `cat appinspect_result.json | jq '.summary.failure'`

  splunk-test:
    runs-on: ubuntu-latest
    needs: bundle-app
    strategy:
      fail-fast: false
      matrix:
        version:
          - 9.4.11
          - 10.0.6
          - 10.2.3
    services:
      splunk:
        image: splunk/splunk:${{ matrix.version }}
        env:
          SPLUNK_START_ARGS: --accept-license --answer-yes --no-prompt
          SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
          SPLUNK_PASSWORD: password
        options: >-
          --health-interval 30s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8000:8000
          - 8089:8089

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: app_dir
          path: jellyfisher

      - name: Copy app to service container
        run: docker cp jellyfisher ${{ job.services.splunk.id }}:/opt/splunk/etc/apps/jellyfisher

      - run: docker exec -i ${{ job.services.splunk.id }} ls -a /opt/splunk/etc/apps/jellyfisher
      - run: docker exec -i ${{ job.services.splunk.id }} ls -a /opt/splunk/etc/apps

      - name: Restart instance and wait for Splunk to be up again
        run: |
          curl -k -u admin:password "https://localhost:8089/services/server/control/restart?output_mode=json" -X POST
          echo ""
          echo "Waiting for Splunk to restart..."
          sleep 90
          for i in {1..60}; do
            HTTP_CODE=$(curl -sk --tlsv1.2 -o /dev/null -w "%{http_code}" \
              -u "admin:password" \
              "https://localhost:8089/services/server/info")
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "  ✅ Splunk is up and authenticated (attempt ${i})"
              exit 0
            fi

            echo "  Attempt ${i}/60: HTTP ${HTTP_CODE} — waiting 5s..."
            sleep 5
          done

          echo "❌ Splunk did not become ready"
          exit 1

      - name: Print App Configuration
        run: |
          curl -k -u admin:password https://localhost:8089/services/apps/local/jellyfisher?output_mode=json

      - name: Test Jellyfisher command
        run:
          curl -k -u admin:password https://localhost:8089/services/search/jobs/export -d search="|makeresults n=3 | eval x=\"asd\" | eval y=\"asf\" | jellyfisher levenshtein_distance(x,y)" -d output_mode=json | jq -e '(.result.levenshtein_distance | contains("1"))'



  appinspect-api:
      name: AppInspect API Validation
      needs:
        - appinspect-cli
        - slim-validate
      runs-on: ubuntu-latest
      # if: github.ref == 'refs/heads/master'
      if: false  # This condition ensures the job is always skipped since secrets are outdated.
      steps:
      # - uses: actions/download-artifact@v5
      #   with:
      #     name: app_tgz
      - uses: actions/checkout@v6
      - run: ls -a
      - uses: splunk/appinspect-api-action@v3.0
        with:
          # filePath: jellyfisher.tgz
          app_path: jellyfisher
          username: ${{ secrets.SPLUNK_USER }}
          password: ${{ secrets.SPLUNK_PASS }}
          included_tags: "cloud"
